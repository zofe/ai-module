<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 22 1164 920" width="1164" height="920" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How ai-module protects data before calling the AI</title>
  <defs>
    <marker id="dp-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b4a"/></marker>
    <marker id="dp-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4500f"/></marker>
    <style>
      .dp-h { font-size: 19px; font-weight: 800; fill: #1d2421; }
      .dp-d { font-size: 13.5px; fill: #55605b; }
      .dp-lab { font-size: 13.5px; font-weight: 800; }
      .dp-m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13px; fill: #1d2421; }
      .dp-real { fill: #b4500f; font-weight: 700; }
      .dp-ph { fill: #2a5d93; font-weight: 700; }
      .dp-zone { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; }
      .dp-num { font-size: 13px; font-weight: 800; fill: #fff; }
      .dp-note { font-size: 13px; fill: #55605b; }
    </style>
  </defs>

  <rect width="1200" height="960" fill="#fbfbf9"/>

  <!-- Titolo -->
  <text x="40" y="50" font-size="26" font-weight="800" fill="#1d2421">How ai-module protects data before calling the AI</text>
  <text x="40" y="78" class="dp-d" font-size="15">Real values <tspan class="dp-real">in orange</tspan> never leave your network: the remote AI receives only placeholders <tspan class="dp-ph">in blue</tspan>.</text>

  <!-- Zone -->
  <rect x="24" y="102" width="784" height="834" rx="20" fill="#eef4f0"/>
  <text x="48" y="130" class="dp-zone" fill="#2e6b4a">YOUR NETWORK</text>
  <rect x="824" y="102" width="352" height="834" rx="20" fill="#f8efe6" stroke="#d9b391" stroke-dasharray="8 6"/>
  <text x="848" y="130" class="dp-zone" fill="#a04a14">INTERNET</text>

  <!-- Intestazioni delle colonne -->
  <!-- Applicazione -->
  <rect x="56" y="148" width="288" height="118" rx="14" fill="#ffffff" stroke="#c8d8ce"/>
  <rect x="74" y="168" width="36" height="28" rx="5" fill="none" stroke="#2a5d93" stroke-width="2.2"/>
  <line x1="74" y1="176" x2="110" y2="176" stroke="#2a5d93" stroke-width="2.2"/>
  <circle cx="79" cy="172" r="1.4" fill="#2a5d93"/><circle cx="84" cy="172" r="1.4" fill="#2a5d93"/>
  <text x="122" y="189" class="dp-h">Application</text>
  <text x="74" y="250" class="dp-lab" fill="#2a5d93">masks · calls the AI · restores</text>
  <rect x="74" y="210" width="86" height="26" rx="13" fill="#e8eff7"/><text x="117" y="228" class="dp-d" font-size="12.5" text-anchor="middle">context</text>
  <rect x="166" y="210" width="86" height="26" rx="13" fill="#e8eff7"/><text x="209" y="228" class="dp-d" font-size="12.5" text-anchor="middle">tools</text>
  <rect x="258" y="210" width="72" height="26" rx="13" fill="#2a5d93"/><text x="294" y="228" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">ai-module</text>

  <!-- Presidio -->
  <rect x="456" y="148" width="288" height="124" rx="14" fill="#ffffff" stroke="#c8d8ce"/>
  <path d="M492,166 L510,172 L510,186 C510,196 502,202 492,206 C482,202 474,196 474,186 L474,172 Z" fill="#e3efe7" stroke="#2e6b4a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M484,186 L490,192 L501,180" fill="none" stroke="#2e6b4a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="522" y="189" class="dp-h">Presidio</text>
  <text x="474" y="226" class="dp-lab" fill="#2e6b4a">finds the names in the text</text>
  <text x="474" y="246" class="dp-d">Microsoft, open source, on your servers.</text>
  <text x="474" y="262" class="dp-d" font-size="12.5">It masks nothing and stores nothing.</text>

  <!-- Remote AI -->
  <rect x="852" y="148" width="296" height="124" rx="14" fill="#ffffff" stroke="#e6c9ad"/>
  <path d="M880,200 C868,200 864,186 876,182 C874,170 890,164 896,174 C902,164 920,168 918,182 C930,184 928,200 916,200 Z" fill="#fbe9da" stroke="#b4500f" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="934" y="189" class="dp-h">Remote AI</text>
  <text x="870" y="226" class="dp-lab" fill="#b4500f">sees only placeholders</text>
  <text x="870" y="246" class="dp-d">DeepSeek, Anthropic, OpenAI…</text>
  <text x="870" y="262" class="dp-d" font-size="12.5">outside your network</text>

  <!-- Linee di vita -->
  <line x1="200" y1="272" x2="200" y2="880" stroke="#9fb3a7" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <line x1="600" y1="272" x2="600" y2="880" stroke="#9fb3a7" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <line x1="1000" y1="272" x2="1000" y2="880" stroke="#d9b391" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>

  <!-- 1 · App → Presidio -->
  <rect x="226" y="282" width="348" height="50" rx="10" fill="#ffffff" stroke="#bcd3c4"/>
  <circle cx="246" cy="298" r="11" fill="#2e6b4a"/><text x="246" y="302.5" class="dp-num" text-anchor="middle">1</text>
  <text x="264" y="303" class="dp-lab" fill="#2e6b4a">The text, to find the names</text>
  <text x="240" y="323" class="dp-m">“Customer <tspan class="dp-real">Mario Rossi</tspan> (<tspan class="dp-real">Rossi srl</tspan>)…”</text>
  <line x1="204" y1="346" x2="590" y2="346" stroke="#2e6b4a" stroke-width="2.6" marker-end="url(#dp-g)"/>
  <rect x="593" y="346" width="14" height="70" rx="3" fill="#2e6b4a" opacity=".85"/>

  <!-- 2 · Presidio → App -->
  <rect x="226" y="362" width="348" height="54" rx="10" fill="#ffffff" stroke="#bcd3c4"/>
  <circle cx="246" cy="380" r="11" fill="#2e6b4a"/><text x="246" y="384.5" class="dp-num" text-anchor="middle">2</text>
  <text x="264" y="385" class="dp-lab" fill="#2e6b4a">Where the names are</text>
  <text x="240" y="406" class="dp-m">PERSON · characters 9–20 · 0.85</text>
  <line x1="590" y1="432" x2="210" y2="432" stroke="#2e6b4a" stroke-width="2.6" marker-end="url(#dp-g)"/>

  <!-- Oscura (sulla colonna dell'applicazione) -->
  <rect x="64" y="452" width="272" height="150" rx="12" fill="#ffffff" stroke="#2a5d93" stroke-width="2"/>
  <text x="80" y="476" class="dp-lab" fill="#2a5d93">ai-module masks and keeps the table</text>
  <text x="80" y="500" class="dp-m"><tspan class="dp-ph">[PERSON_1]</tspan>     <tspan class="dp-real">Mario Rossi</tspan></text>
  <text x="80" y="520" class="dp-m"><tspan class="dp-ph">[COMPANY_1]</tspan>    <tspan class="dp-real">Rossi srl</tspan></text>
  <text x="80" y="540" class="dp-m"><tspan class="dp-ph">[EMAIL_ADDRESS_1]</tspan> <tspan class="dp-real">mario@rossi.it</tspan></text>
  <text x="80" y="560" class="dp-m"><tspan class="dp-ph">[CREDENTIAL_1]</tspan> <tspan class="dp-real">S3cret!42</tspan></text>
  <text x="80" y="588" class="dp-note" font-size="12">in memory, for one call only</text>

  <!-- 3 · App → AI -->
  <rect x="352" y="612" width="440" height="58" rx="10" fill="#ffffff" stroke="#e2bf9d"/>
  <circle cx="372" cy="631" r="11" fill="#b4500f"/><text x="372" y="635.5" class="dp-num" text-anchor="middle">3</text>
  <text x="390" y="636" class="dp-lab" fill="#b4500f">Placeholders only, with context and tools</text>
  <text x="366" y="658" class="dp-m">“Customer <tspan class="dp-ph">[PERSON_1]</tspan> (<tspan class="dp-ph">[COMPANY_1]</tspan>)…”</text>
  <line x1="204" y1="686" x2="990" y2="686" stroke="#b4500f" stroke-width="2.8" marker-end="url(#dp-o)"/>
  <rect x="993" y="686" width="14" height="70" rx="3" fill="#b4500f" opacity=".85"/>

  <!-- 4 · AI → App -->
  <rect x="352" y="700" width="440" height="58" rx="10" fill="#ffffff" stroke="#e2bf9d"/>
  <circle cx="372" cy="719" r="11" fill="#b4500f"/><text x="372" y="723.5" class="dp-num" text-anchor="middle">4</text>
  <text x="390" y="724" class="dp-lab" fill="#b4500f">The answer, with placeholders</text>
  <text x="366" y="746" class="dp-m">“<tspan class="dp-ph">[PERSON_1]</tspan>: send the link to <tspan class="dp-ph">[EMAIL_ADDRESS_1]</tspan>”</text>
  <line x1="990" y1="772" x2="210" y2="772" stroke="#b4500f" stroke-width="2.8" marker-end="url(#dp-o)"/>

  <!-- 5 · Ripopola -->
  <rect x="64" y="790" width="272" height="88" rx="12" fill="#ffffff" stroke="#2a5d93" stroke-width="2"/>
  <circle cx="84" cy="812" r="11" fill="#2a5d93"/><text x="84" y="816.5" class="dp-num" text-anchor="middle">5</text>
  <text x="102" y="817" class="dp-lab" fill="#2a5d93">ai-module restores, locally</text>
  <text x="80" y="842" class="dp-d" fill="#1d2421">“<tspan class="dp-real">Mario Rossi</tspan>: send the link</text>
  <text x="80" y="862" class="dp-d" fill="#1d2421">to <tspan class="dp-real">mario@rossi.it</tspan>” → to the user</text>

  <!-- Note in fondo alle colonne -->
  <text x="472" y="866" class="dp-note">If Presidio does not answer,</text>
  <text x="472" y="886" class="dp-note" font-weight="700" fill="#9a2f00">nothing goes to the AI.</text>
  <text x="866" y="866" class="dp-note">It sees neither the database</text>
  <text x="866" y="886" class="dp-note">nor the real values.</text>
  <text x="64" y="902" class="dp-note">Presidio only says where the names are. ai-module decides what to mask</text>
  <text x="64" y="922" class="dp-note">(known names, Presidio, IP, credentials…) and keeps the table.</text>
</svg>
